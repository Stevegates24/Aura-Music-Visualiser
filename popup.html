<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aura</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --p: #a78bfa; --p2: #7c3aed; --pink: #f472b6; --ind: #818cf8; --txt: #f0ebff; --txt2: rgba(240,235,255,0.5); --bdr: rgba(167,139,250,0.15); }

body {
  width: 260px;
  background: #07050f;
  font-family: 'Syne', sans-serif;
  color: var(--txt);
  overflow: hidden;
}

body::before {
  content: '';
  position: fixed; inset: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 100% 80% at 15% 0%, rgba(109,40,217,0.22) 0%, transparent 65%),
    radial-gradient(ellipse 70% 60% at 90% 100%, rgba(244,114,182,0.10) 0%, transparent 55%);
}

.wrap { position: relative; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 14px; }

/* Header */
.header { display: flex; align-items: center; gap: 9px; }
.logo-box {
  width: 30px; height: 30px; flex-shrink: 0;
  background: linear-gradient(135deg, var(--p2), #4c1d95);
  border-radius: 8px; display: flex; align-items: center; justify-content: center;
  border: 1px solid rgba(167,139,250,0.25); box-shadow: 0 0 14px rgba(109,40,217,0.4);
}
.logo-text {
  font-size: 16px; font-weight: 800; letter-spacing: 1.5px;
  background: linear-gradient(135deg, var(--p), var(--ind), var(--pink));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.logo-sub { font-family: 'DM Mono', monospace; font-size: 8.5px; color: var(--txt2); letter-spacing: 1px; margin-top: -2px; }

/* Mini wave canvas */
.wave-wrap {
  height: 44px; border-radius: 9px; border: 1px solid var(--bdr);
  background: rgba(255,255,255,0.02); overflow: hidden;
}
.wave-wrap canvas { width: 100%; height: 100%; display: block; }

/* Status */
.status {
  display: flex; align-items: center; gap: 7px;
  padding: 8px 11px; border-radius: 8px;
  background: rgba(255,255,255,0.03); border: 1px solid var(--bdr);
}
.sdot { width: 6px; height: 6px; border-radius: 50%; background: var(--p); flex-shrink: 0; animation: sp 2s ease-in-out infinite; }
.sdot.idle { background: rgba(255,255,255,0.18); animation: none; }
@keyframes sp { 0%,100%{opacity:1} 50%{opacity:0.5} }
.stxt { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--txt2); flex:1; }

/* Presets — 2 rows of chips, no overflow */
.presets { display: flex; flex-wrap: wrap; gap: 5px; }
.chip {
  padding: 5px 9px; border-radius: 6px; border: 1px solid var(--bdr);
  background: rgba(255,255,255,0.02); color: var(--txt2);
  font-family: 'DM Mono', monospace; font-size: 8.5px; letter-spacing: 0.5px;
  text-transform: uppercase; cursor: pointer; transition: all 0.15s;
}
.chip:hover, .chip.active { border-color: rgba(167,139,250,0.45); background: rgba(167,139,250,0.1); color: var(--p); }

/* Big launch button */
.launch {
  width: 100%; padding: 12px; border-radius: 10px;
  background: linear-gradient(135deg, var(--p2), #4c1d95);
  border: 1px solid rgba(167,139,250,0.28); color: #ede9fe;
  font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; gap: 7px;
  cursor: pointer; transition: all 0.18s; box-shadow: 0 0 20px rgba(109,40,217,0.35);
}
.launch:hover { transform: translateY(-1px); box-shadow: 0 4px 24px rgba(109,40,217,0.55); }
.launch:active { transform: none; }

.hint { font-family: 'DM Mono', monospace; font-size: 8.5px; color: var(--txt2); text-align: center; opacity: 0.45; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="logo-box">
      <svg width="16" height="16" viewBox="0 0 18 18" fill="none">
        <path d="M9 1L16 5V13L9 17L2 13V5L9 1Z" fill="rgba(109,40,217,0.3)" stroke="rgba(167,139,250,0.6)" stroke-width="1"/>
        <circle cx="9" cy="9" r="2" fill="rgba(167,139,250,0.9)"/>
        <path d="M5 9 Q7 6 9 9 Q11 12 13 9" stroke="rgba(167,139,250,0.5)" stroke-width="0.8" fill="none"/>
      </svg>
    </div>
    <div>
      <div class="logo-text">AURA</div>
      <div class="logo-sub">Music Visualizer</div>
    </div>
  </div>

  <div class="wave-wrap"><canvas id="wc"></canvas></div>

  <div class="status">
    <div class="sdot idle" id="sd"></div>
    <div class="stxt" id="st">Checking tab…</div>
  </div>

  <div class="presets" id="presets">
    <div class="chip active" data-p="waves">Waves</div>
    <div class="chip" data-p="bars">Bars</div>
    <div class="chip" data-p="nebula">Nebula</div>
    <div class="chip" data-p="orbit">Orbit</div>
    <div class="chip" data-p="aurora">Aurora</div>
    <div class="chip" data-p="ribbon">Ribbon</div>
    <div class="chip" data-p="buddha">☸ Buddha</div>
  </div>

  <button class="launch" id="lb">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5,3 19,12 5,21"/></svg>
    Open Visualizer
  </button>

  <div class="hint">opens in a new tab · captures tab audio</div>
</div>
<script src="popup.js"></script>
</body>
</html>
