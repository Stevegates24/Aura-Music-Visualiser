<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #06040f; --p: #a78bfa; --p2: #7c3aed;
    --pink: #f472b6; --ind: #818cf8;
    --txt: #f0ebff; --txt2: rgba(240,235,255,0.55);
    --bdr: rgba(167,139,250,0.18);
  }
  body {
    width: 280px; background: var(--bg);
    font-family: 'Syne', sans-serif; color: var(--txt);
    overflow: hidden; position: relative;
  }
  body::before {
    content: ''; position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 0%, rgba(109,40,217,0.25) 0%, transparent 70%),
      radial-gradient(ellipse 60% 50% at 90% 100%, rgba(244,114,182,0.12) 0%, transparent 60%);
    pointer-events: none;
  }
  .container {
    position: relative; z-index: 1; padding: 20px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .header { display: flex; align-items: center; gap: 10px; }
  .logo-icon {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--p2), #4c1d95);
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(167,139,250,0.3);
    box-shadow: 0 0 16px rgba(109,40,217,0.4); flex-shrink: 0;
  }
  .logo-text {
    font-size: 18px; font-weight: 800; letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--p) 0%, var(--ind) 60%, var(--pink) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .logo-sub {
    font-family: 'DM Mono', monospace; font-size: 9px; color: var(--txt2);
    letter-spacing: 1px; text-transform: uppercase; margin-top: -2px;
  }
  .wave-preview {
    width: 100%; height: 48px; border-radius: 10px;
    border: 1px solid var(--bdr); background: rgba(255,255,255,0.02); overflow: hidden;
  }
  .wave-preview canvas { width: 100%; height: 100%; display: block; }
  .status-row {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    border-radius: 8px; background: rgba(255,255,255,0.03); border: 1px solid var(--bdr);
  }
  .status-dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--p);
    flex-shrink: 0; animation: pulse 2s ease-in-out infinite;
  }
  .status-dot.no-media { background: rgba(255,255,255,0.2); animation: none; }
  @keyframes pulse {
    0%,100% { opacity:1; box-shadow: 0 0 0 0 rgba(167,139,250,0.4); }
    50%      { opacity:0.7; box-shadow: 0 0 0 4px rgba(167,139,250,0); }
  }
  .status-text { font-size: 11px; font-family: 'DM Mono', monospace; color: var(--txt2); flex: 1; }
  .launch-btn {
    width: 100%; padding: 13px; border-radius: 10px;
    background: linear-gradient(135deg, var(--p2), #4c1d95);
    border: 1px solid rgba(167,139,250,0.3); color: #ede9fe;
    font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700;
    letter-spacing: 0.3px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: all 0.2s; box-shadow: 0 0 24px rgba(109,40,217,0.35);
  }
  .launch-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 28px rgba(109,40,217,0.55); }
  .presets-row { display: flex; gap: 6px; }
  .preset-chip {
    flex: 1; padding: 7px 4px; border-radius: 7px;
    border: 1px solid var(--bdr); background: rgba(255,255,255,0.025);
    color: var(--txt2); font-family: 'DM Mono', monospace;
    font-size: 9px; letter-spacing: 0.5px; text-align: center;
    cursor: pointer; transition: all 0.18s; text-transform: uppercase;
  }
  .preset-chip:hover, .preset-chip.active {
    border-color: rgba(167,139,250,0.5);
    background: rgba(167,139,250,0.1); color: var(--p);
  }
  .footer-note {
    font-family: 'DM Mono', monospace; font-size: 9px; color: var(--txt2);
    text-align: center; opacity: 0.5; letter-spacing: 0.3px;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo-icon">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M9 1L16 5V13L9 17L2 13V5L9 1Z" fill="rgba(109,40,217,0.3)" stroke="rgba(167,139,250,0.6)" stroke-width="1"/>
        <circle cx="9" cy="9" r="2" fill="rgba(167,139,250,0.9)"/>
        <path d="M5 9 Q7 6 9 9 Q11 12 13 9" stroke="rgba(167,139,250,0.5)" stroke-width="0.8" fill="none"/>
      </svg>
    </div>
    <div>
      <div class="logo-text">AURA</div>
      <div class="logo-sub">Music Visualizer</div>
    </div>
  </div>

  <div class="wave-preview"><canvas id="miniWave"></canvas></div>

  <div class="status-row">
    <div class="status-dot no-media" id="statusDot"></div>
    <div class="status-text" id="statusText">Checking for media…</div>
  </div>

  <div class="presets-row">
    <div class="preset-chip active" data-preset="waves">Waves</div>
    <div class="preset-chip" data-preset="bars">Bars</div>
    <div class="preset-chip" data-preset="nebula">Nebula</div>
    <div class="preset-chip" data-preset="orbit">Orbit</div>
    <div class="preset-chip" data-preset="aurora">Aurora</div>
    <div class="preset-chip" data-preset="ribbon">Ribbon</div>
  </div>

  <button class="launch-btn" id="launchBtn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="5,3 19,12 5,21"/>
    </svg>
    Open Visualizer
  </button>

  <div class="footer-note">opens in a new tab · captures tab audio</div>
</div>
<script src="popup.js"></script>
</body>
</html>
